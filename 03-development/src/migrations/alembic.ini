# [FR-07] Alembic configuration.
#
# ``script_location`` is the *relative* path from this file's directory
# to the migrations package; revisions live in ``<script_location>/versions``
# and Alembic imports them as ``migrations.versions.<revision_id>`` once
# the parent of ``script_location`` is on ``sys.path``. The subprocess
# driver in ``tests/test_fr07.py`` adds ``03-development/src`` to
# ``PYTHONPATH`` so the dotted imports resolve identically from the
# parent process and the ``alembic`` CLI.
#
# Citations: SPEC.md §3 FR-07; alembic Config docs.

[alembic]
script_location = .
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# Default URL is overridden at runtime from ``TASKQ_DB_URL`` in ``env.py``.
sqlalchemy.url = sqlite:///./taskq.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
